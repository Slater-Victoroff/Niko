services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    gpus: all
    volumes:
      - /home/sl8rv/Projects/Niko/data/datasets:/app/data/datasets:ro
      - ./src:/app/src:cached
      - ./checkpoints:/app/checkpoints
      - ./configs:/app/configs
      - ./niko_samples:/app/niko_samples
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
    working_dir: /app
    command: sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import torch; print('cuda', torch.cuda.is_available()); print('cudnn', torch.backends.cudnn.version())\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
