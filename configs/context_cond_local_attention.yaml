# Same as context_cond_helmholtz.yaml, except the operator's skew term
# (learned skew-symmetric channel mixing) is swapped for local_attention
# (learned windowed self-attention over each position's spatial
# neighborhood) -- a direct A/B against the Helmholtz skew term, everything
# else (encoder, cond source, decoder) held fixed.
# attn_hidden_dim=112 param-matches local_attention's 8,576 params against
# skew's 8,448 (window itself adds no params -- it only changes how many
# neighbors get gathered per position -- so this is the real capacity knob).
# batch=4 (vs skew run's batch=8) to make room for the wider attention term;
# not a batch-matched comparison against plain_helmholtz_broad8/the first
# local_attention attempt.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_local_attention
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  window: 5
  attn_hidden_dim: 112

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
