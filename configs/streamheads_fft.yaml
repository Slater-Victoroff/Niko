# Same as streamheads.yaml, except encoder.name: split_encoder_fft -- the complex
# branch is fed from an rfft2 of the last raw context frame (cropped to match
# real_net's output resolution) instead of a from-scratch learned CNN. Everything
# else (operator, decoder, real_net) is identical, for an apples-to-apples
# comparison against streamheads.yaml.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true
param_encoder:
  name: rb_param
  cond_dim: 32
  h_dim: 64

encoder:
  name: split_encoder_fft
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: complex_operator
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  complex_term: true

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
