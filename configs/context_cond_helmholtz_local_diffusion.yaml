# Same as context_cond_helmholtz.yaml (FiLM-conditioned advection+diffusion+
# skew+forcing), except plain scalar-per-sample `diffusion` is swapped for
# `local_diffusion` -- spatially-varying, state-responsive diffusivity
# (log_nu = log_nu_head(cond) + a small zero-inited conv on z.real_grid,
# see LocalDiffusionTerm's docstring) instead of one nu per sample. Exact
# no-op vs plain DiffusionTerm at init (verified: 0.000e+00 max abs diff on
# real tensors), only diverges as training finds local/state-dependent
# structure useful. Via the generic `transport` operator, no new preset
# class needed, same pattern as the no_diffusion/no_skew/no_film ablations.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: transport
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  terms: [advection, local_diffusion, skew, forcing]
  film: true

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
