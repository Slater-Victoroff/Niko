# Same operator/decoder/main-encoder as context_cond_pooled_helmholtz.yaml
# (the current best, valid_loss 0.229) -- only the conditioner changes.
# context_cond_encoder (LatentContextCondEncoder) runs each context frame
# through a FROZEN, separately pretrained single-frame autoencoder's encoder
# (see train_autoencoder_baseline.py --context-frames 1,
# checkpoints/autoencoder_ctx1_broad8) instead of a from-scratch trunk
# operating on raw pixels, then the same shared-refine-trunk + two-stage
# pool (spatial, then temporal) as PooledContextCondEncoder.
# ae_checkpoint path below must point at a trained ctx1 autoencoder
# checkpoint before this config can be used.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true

context_cond_encoder:
  name: latent_pooled
  in_channels: 4
  cond_dim: 32
  ae_checkpoint: /app/checkpoints/autoencoder_ctx1_broad8/ae_ep6_ctx1_vloss0.1606.pt
  ae_latent_dim: 16
  ae_hidden_dim: 64
  hidden_dim: 128
  freeze_ae_encoder: true

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_helmholtz
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
