# Same as streamheads_fft.yaml, except encoder.name: split_encoder_fft_wide --
# the complex branch (still fed from rfft2 of the last frame) gets a 2x
# ConvNeXtBlock refinement stack instead of a single 1x1 conv, mirroring
# complex_net's original refinement depth minus its now-redundant downsample
# conv. ~39K complex-branch params vs split_encoder_fft's 288.
#
# First version of this config diverged over a 7-epoch/8-combo run (healthy
# through epoch 3, then progressively worse spikes epoch 4-7, no NaN/Inf --
# a drift, not a blowup). Two fixes applied together for the retry:
#   1. complex_proj's output layer is now zero-inited (split_encoder.py) --
#      starts as a no-op instead of injecting an uncontrolled random-scale
#      perturbation into the operator's multiplicative amplitude/rotation
#      terms from step one.
#   2. amplitude_scale: 0.5 below -- tightens the operator's per-rollout-step
#      multiplicative ceiling from exp(±1)≈2.72x to exp(±0.5)≈1.65x, i.e.
#      ~20x worst-case over a 6-step rollout instead of ~405x. baseline
#      (streamheads.yaml) is untouched -- amplitude_scale defaults to 1.0.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true
param_encoder:
  name: rb_param
  cond_dim: 32
  h_dim: 64

encoder:
  name: split_encoder_fft_wide
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: complex_operator
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  complex_term: true
  amplitude_scale: 0.5

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
