# Plain baseline (context_cond_helmholtz.yaml), trained directly at
# rollout_steps=16 instead of 6 -- the control for
# context_cond_helmholtz_rotation_roll16.yaml: does longer-horizon training
# help stability generally (both models), or fix something specific to the
# winner's compounding rotation? See EXPERIMENT_LOG.md §14-15.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_helmholtz
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true

model:
  use_checkpointing: true
