# Same as context_cond_helmholtz.yaml (advection+diffusion+skew+forcing),
# except film: false -- cond gets concatenated onto the latent grid at each
# term instead of modulating it via FiLM. Quick ablation via the generic
# `transport` operator to see how much of context_cond_helmholtz's result is
# actually coming from FiLM conditioning specifically (this is otherwise
# exactly HelmholtzTransportOperator's own recipe -- concat instead of FiLM
# with all four terms -- so `name: helmholtz_transport` would work too, but
# using `transport` here keeps this config's terms/film explicit and
# symmetric with the no_diffusion ablation).
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: transport
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  terms: [advection, diffusion, skew, forcing]
  film: false

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
