# Encoder fuses real_net + irfft(rfft2 of the last frame) into a single real
# latent (see FusedSpectralEncoder) instead of keeping real/spectral separate.
# No persistent complex-space state survives into the operator, so this uses
# film_helmholtz -- the same real terms (advection/diffusion/skew/forcing),
# FiLM-conditioned, as complex_operator, just without the complex rotation
# term it has nothing left to feed.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true
param_encoder:
  name: rb_param
  cond_dim: 32
  h_dim: 64

encoder:
  name: fused_spectral_encoder
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_helmholtz
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
