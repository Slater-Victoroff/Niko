# Same as context_cond_helmholtz.yaml (FiLM-conditioned advection+diffusion+
# skew+forcing), except the skew term is dropped entirely -- terms=
# [advection, diffusion, forcing], film still on. This is exactly
# FiLMAdvectionDiffusionOperator's own recipe (the "film_advection_diffusion"
# preset already covers it) -- using the generic `transport` operator here
# instead just keeps this config symmetric with the no_diffusion/no_film
# ablations sitting next to it.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: transport
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  terms: [advection, diffusion, forcing]
  film: true

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
