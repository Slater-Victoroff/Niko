# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true
param_encoder:
  name: rb_param
  cond_dim: 32
  h_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_advection_diffusion
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
