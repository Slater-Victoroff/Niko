# Same as context_cond_helmholtz.yaml (FiLM-conditioned advection+diffusion+
# skew+forcing), except the diffusion term is dropped entirely -- terms=
# [advection, skew, forcing], film still on. Quick ablation via the generic
# `transport` operator (TransportOperator already takes terms/film directly,
# no new preset class needed) to see whether the learned nu*laplacian term
# is pulling real weight or is redundant with what advection/skew can do.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: transport
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  terms: [advection, skew, forcing]
  film: true

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
