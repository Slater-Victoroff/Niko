# Same as context_cond_helmholtz.yaml (FiLM-conditioned advection+diffusion+
# skew+forcing), except the forcing term is dropped entirely -- terms=
# [advection, diffusion, skew], film still on. Forcing is the second most
# expensive term (42,768 params) and, like advection, had never actually
# been ablated -- no config existed to check whether it's pulling its
# weight. Via the generic `transport` operator, no new preset class needed,
# same pattern as the other ablations sitting next to it.
anchor_target: true

context_cond_encoder:
  in_channels: 4
  cond_dim: 32
  hidden_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: transport
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  terms: [advection, diffusion, skew]
  film: true

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
