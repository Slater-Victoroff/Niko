# Same as plain_helmholtz.yaml, except the operator's skew term (learned
# skew-symmetric channel mixing) is swapped for local_attention (learned
# windowed self-attention over each position's spatial neighborhood) -- a
# direct A/B against the Helmholtz skew term, everything else (encoder,
# param source, decoder) held fixed.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true
param_encoder:
  name: rb_param
  cond_dim: 32
  h_dim: 64

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_local_attention
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32
  window: 5
  attn_hidden_dim: 112

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
