# Same as context_cond_helmholtz.yaml (cond inferred from x_context, no
# ground-truth params used anywhere), but context_cond_encoder uses the
# per-frame-trunk-then-pool architecture (PooledContextCondEncoder) that beat
# the stacked-as-channels design decisively in the param-regression
# comparison, instead of ContextCondEncoder's stacked design. Also sized up
# (hidden_dim=128) since that design has real headroom to use it.
# rollout_steps and context_frames are passed as CLI args to train.py / eval scripts.
anchor_target: true

context_cond_encoder:
  name: pooled
  in_channels: 4
  cond_dim: 32
  hidden_dim: 128

encoder:
  name: sequence_conv
  in_channels: 4
  latent_dim: 16
  hidden_dim: 64

operator:
  name: film_helmholtz
  latent_dim: 16
  hidden_dim: 64
  cond_dim: 32

decoder:
  name: shared_heads
  latent_dim: 16
  hidden_dim: 48
  upsample: 2
  zero_mean_pressure: true
  use_streamfunction: true
